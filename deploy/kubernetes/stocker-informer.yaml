apiVersion: v1
kind: Namespace
metadata:
  name: stocker
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stocker-informer-config
  namespace: stocker
data:
  RABBITMQ_INPUT_EXCHANGE: stocker
  RABBITMQ_INPUT_EXCHANGE_TYPE: topic
  RABBITMQ_INPUT_ROUTING_KEY: stock.gems.v1.#
  RABBITMQ_QUEUE: stock.gems.v1.informer
  RABBITMQ_PREFETCH: "1"
  RABBITMQ_CONNECT_TIMEOUT_SECONDS: "10"
  S3_ENDPOINT: http://192.168.1.31:30188
  S3_REGION: garage
  S3_TIMEOUT_SECONDS: "10"
  S3_BUCKET: stocker
  GOTOSOCIAL_INSTANCE: https://wheeli.social
  GOTOSOCIAL_USER: bot
  GOTOSOCIAL_AUDIENCE: local
  OLLAMA_ENABLED: "true"
  OLLAMA_BASE_URL: http://192.168.1.71:11434
  OLLAMA_MODEL: qwen3.6:35b
  OLLAMA_TIMEOUT_SECONDS: "3600"
  OLLAMA_MAX_TOKENS: "131072"
  OLLAMA_MAX_OUTPUT_CHARS: "0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stocker-informer
  namespace: stocker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stocker-informer
  template:
    metadata:
      labels:
        app: stocker-informer
    spec:
      containers:
        - name: stocker-informer
          image: git.wheeli.ca/brian/stocker-informer:latest
          imagePullPolicy: Always
          ports:
            - name: health
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: stocker-informer-config
            - secretRef:
                name: stocker-informer-env
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 2048Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            runAsUser: 65532
            runAsGroup: 65532
